<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lab05</title>
<style>
a
{
font-size: 20px;
display: flex;
justify-content: center;
font-weight: bold;
}
body
{
display: flex;
font-family: Arial;
background-color: lightgrey;
justify-content: center;
margin: 100px;
}
form
{
background-color: white;
padding: 30px;
width: 300px;
border-radius: 12px;
}
input:not([type="checkbox"])
{
font-size: 14px;
margin-bottom: 9px;
padding: 6px;
width:90%;
border-radius: 6px;
border-style: solid;
border-color: lightgrey;
border-width: 2px;
}
select
{
font-size: 14px;
margin-bottom: 9px;
padding: 6px;
width:96%;
border-radius: 6px;
border-style: solid;
border-color: lightgrey;
border-width: 2px;
}
input[type="submit"]
{
background-color:LightSkyBlue;
padding: 12px;
color: white;
font-weight: bold;
font-size: 18px;
border-radius: 10px;
border: 0px;
width: 100%;
}
input[type="checkbox"]
{
font-size: 14px;
margin-bottom: 15px;
}
input[type="submit"]:hover
{
background-color:steelblue;
}
textarea
{
font-size: 14px;
margin-bottom: 4px;
padding: 6px;
width: 90%;
height: 80px;
border-radius: 6px;
border: 2px solid lightgrey;
resize: vertical;
}
.komunikat
{
font-size: 14px;
margin-bottom: 9px;
color: red;
}
.adres
{
width: 94%;
display: flex;
gap: 5px;
}
.ulica
{
flex: 65;
min-width: 0;
}
.numer
{
flex: 35;
min-width: 0;
}
</style>
</head>

<body>
<form action="" method="" id="formularz" onsubmit="return sprawdz()" novalidate>
<a>FORMULARZ</a><br>

Imie: <input type="text" name="imie" id="imie" minlength="2" maxlength="30" oninput="usunblad('bladImie','imie')">
<div id="bladImie" class="komunikat"></div>

Nazwisko: <input type="text" name="nazwisko" id="nazwisko" minlength="2" maxlength="50" oninput="usunblad('bladNazwisko','nazwisko')">
<div id="bladNazwisko" class="komunikat"></div>

<div class="adres">
<div class="ulica">
Ulica:
<input type="text" name="ulica" id="ulica" minlength="2" maxlength="50" oninput="usunblad('bladUlica','ulica')">
<div id="bladUlica" class="komunikat"></div>
</div>

<div class="numer">
Nr budynku:
<input type="text" name="numer" id="numer" maxlength="10" oninput="usunblad('bladNumer','numer')">
<div id="bladNumer" class="komunikat"></div>
</div>
</div>


Miasto: <input type="text" name="miasto" id="miasto" minlength="2" maxlength="50" oninput="usunblad('bladMiasto','miasto')">
<div id="bladMiasto" class="komunikat"></div>

Data urodzenia: <input type="date" name="data" id="data" onchange="usunblad('bladData','data')">
<div id="bladData" class="komunikat"></div>

Telefon: <input type="tel" name="telefon" id="telefon" maxlength="9" placeholder="123456789" oninput="tylkoCyfry(); usunblad('bladTelefon','telefon')">
<div id="bladTelefon" class="komunikat"></div>

Województwo:
<select name="wojewodztwo" id="wojewodztwo" onchange="usunblad('bladWojewodztwo','wojewodztwo')">
<option value="">Wybierz województwo</option>
<option value="mazowieckie">Mazowieckie</option>
<option value="dolnoslaskie">Dolnośląskie</option>
<option value="kujawskopomorskie">Kujawsko-pomorskie</option>
<option value="lubuskie">Lubuskie</option>
<option value="lubelskie">Lubelskie</option>
<option value="lodzkie">Łódzkie</option>
<option value="malopolskie">Małopolskie</option>
<option value="opolskie">Opolskie</option>
<option value="podkarpackie">Podkarpackie</option>
<option value="podlaskie">Podlaskie</option>
<option value="pomorskie">Pomorskie</option>
<option value="slaskie">Śląskie</option>
<option value="swietokrzyskie">Świętokrzyskie</option>
<option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
<option value="wielkopolskie">Wielkopolskie</option>
<option value="zachodniopomorskie">Zachodniopomorskie</option>
</select>
<div id="bladWojewodztwo" class="komunikat"></div>

Hasło: <input type="password" name="haslo" id="haslo" minlength="8" maxlength="50" oninput="usunblad('bladHaslo','haslo')">
<div id="bladHaslo" class="komunikat"></div>

Email: <input type="email" name="email" id="email" oninput="usunblad('bladEmail','email')">
<div id="bladEmail" class="komunikat"></div>

Prawo jazdy: <input type="checkbox" name="prawojazdy"> <br>

Uwagi: <textarea id="uwagi" name="uwagi" maxlength="250" oninput="usunblad('bladUwagi','uwagi')"></textarea>
<div id="bladUwagi" class="komunikat"></div>

<input type="submit" value="OK" name="p1">
</form>

<script>
function blad(komunikat,tekst,pole)
{
document.getElementById(komunikat).textContent=tekst;
document.getElementById(pole).style.borderColor="red";
}

function usunblad(komunikat,pole)
{
document.getElementById(komunikat).textContent="";
document.getElementById(pole).style.borderColor="lightgrey";
}

function tylkoCyfry()
{
var telefon=document.getElementById("telefon");
telefon.value=telefon.value.replace(/[^0-9]/,'');
}

function waliduj(wartosc,reg,min,max,komunikat,tekst,pole)
{
if(!reg.test(wartosc) || wartosc.length<min || wartosc.length>max)
{
    blad(komunikat,tekst,pole)
    return false;
}
else
{
    usunblad(komunikat,pole)
    return true;
}
}

function sprawdz()
{
var imie=document.getElementById("imie").value;
var nazwisko=document.getElementById("nazwisko").value;
var ulica=document.getElementById("ulica").value;
var miasto=document.getElementById("miasto").value;
var data=document.getElementById("data").value;
var telefon=document.getElementById("telefon").value;
var wojewodztwo=document.getElementById("wojewodztwo").value;
var haslo=document.getElementById("haslo").value;
var email=document.getElementById("email").value;
var uwagi=document.getElementById("uwagi").value;
var poprawny=true;
var numerBudynku=document.getElementById("numer").value;

var regImie = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+$/;
var regNazwisko = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+([ -][A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?$/;
var regUlica = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+([ -][A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)*$/;
var regMiasto = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+([ -][A-ZĄĆĘŁŃŃÓŚŹŻ][a-ząćęłńóśźż]+){0,3}$/;
var regTelefon = /^[0-9]{9}$/;
var regHaslo = /^.+$/;
var regEmail = /^[a-zA-Z0-9]([a-zA-Z0-9]|[._-][a-zA-Z0-9])+@[a-zA-Z0-9-]+[.][a-zA-Z]{2,}$/;
var regNumer = /^[0-9]+[a-zA-Z]?(\/[0-9]+)?$/;

if(!waliduj(imie,regImie,2,30,"bladImie","Imię musi zaczynać się wielką literą i mieć od 2 do 30 znaków","imie"))
{
    poprawny=false;
}

if(!waliduj(nazwisko,regNazwisko,2,50,"bladNazwisko","Nazwisko musi zaczynać się wielką literą i mieć od 2 do 50 znaków. Może mieć 2 człony","nazwisko"))
{
    poprawny=false;
}

if(!waliduj(ulica,regUlica,2,50,"bladUlica","Ulica musi zaczynać się wielką literą, mieć od 2 do 50 znaków i zawierać wyłącznie litery.","ulica"))
{
    poprawny=false;
}

if(!waliduj(miasto,regMiasto,2,50,"bladMiasto","Miasto musi zaczynać się wielką literą i mieć od 2 do 50 znaków. Maksymalnie 4 człony","miasto"))
{
    poprawny=false;
}

if(data=="")
{
    blad("bladData","Podaj datę urodzenia","data")
    poprawny=false;
}
else
{
    usunblad("bladData","data")
}

if(!waliduj(telefon,regTelefon,9,9,"bladTelefon","Telefon musi składać się z dokładnie 9 cyfr","telefon"))
{
    poprawny=false;
}

if(wojewodztwo=="")
{
    blad("bladWojewodztwo","Wybierz województwo","wojewodztwo")
    poprawny=false;
}
else
{
    usunblad("bladWojewodztwo","wojewodztwo")
}

if(!regHaslo.test(haslo) || haslo.length<8 || haslo.length>50 || !/[a-zA-Z]/.test(haslo) || !/[0-9]/.test(haslo))
{
    blad("bladHaslo","Hasło musi mieć od 8 do 50 znaków oraz minimum jedną literę i cyfrę","haslo")
    poprawny=false;
}
else
{
    usunblad("bladHaslo","haslo")
}

if(!waliduj(email,regEmail,5,100,"bladEmail","Podaj poprawny adres email, np. test@gmail.com","email"))
{
    poprawny=false;
}

if(uwagi.length>250)
{
    blad("bladUwagi","Uwagi mogą mieć maksymalnie 250 znaków","uwagi")
    poprawny=false;
}
else
{
    usunblad("bladUwagi","uwagi")
}
if(!waliduj(numerBudynku,regNumer,1,10,"bladNumer","Podaj poprawny numer budynku, np. 12, 12A lub 12/5","numer"))
{
    poprawny=false;
}

return poprawny
}
</script>

</body>
</html>

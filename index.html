
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Lab03_1</title>

<style>
a
{
font-size: 20px;
display: flex;
justify-content: center;
font-weight: bold;
}
body
{
display: flex;
font-family: Arial;
background-color: lightgrey;
justify-content: center;
margin: 100px;
}
form
{
background-color: white;
padding: 30px;
width: 300px;
border-radius: 12px;
}
input:not([type="checkbox"])
{
font-size: 14px;
margin-bottom: 4px;
padding: 6px;
width: 90%;
border-radius: 6px;
border-style: solid;
border-color: lightgrey;
border-width: 2px;
}
select
{
font-size: 14px;
margin-bottom: 4px;
padding: 6px;
width: 96%;
border-radius: 6px;
border: 2px solid lightgrey;
}
textarea
{
font-size: 14px;
margin-bottom: 4px;
padding: 6px;
width: 90%;
height: 80px;
border-radius: 6px;
border: 2px solid lightgrey;
resize: vertical;
}
.komunikat
{
color: red;
font-size: 12px;
margin-bottom: 9px;
}
input[type="submit"]
{
background-color: LightSkyBlue;
padding: 12px;
color: white;
font-weight: bold;
font-size: 18px;
border-radius: 10px;
border: 0px;
width: 100%;
cursor: pointer;
}
input[type="checkbox"]
{
font-size: 14px;
margin-bottom: 15px;
}
input[type="submit"]:hover
{
background-color: steelblue;
}
</style>
</head>

<body>

<form action="" method="post" id="formularz"
onsubmit="return sprawdz()" novalidate>

<a>FORMULARZ</a><br><br>

Imie:
<input type="text" id="imie" name="imie"
minlength="2" maxlength="50"
oninput="usunBlad('imie', 'bladImie')">
<div id="bladImie" class="komunikat"></div>

Nazwisko:
<input type="text" id="nazwisko" name="nazwisko"
minlength="2" maxlength="50"
oninput="usunBlad('nazwisko', 'bladNazwisko')">
<div id="bladNazwisko" class="komunikat"></div>

Ulica:
<input type="text" id="ulica" name="ulica"
minlength="2" maxlength="50"
oninput="usunBlad('ulica', 'bladUlica')">
<div id="bladUlica" class="komunikat"></div>

Miasto:
<input type="text" id="miasto" name="miasto"
minlength="2" maxlength="50"
oninput="usunBlad('miasto', 'bladMiasto')">
<div id="bladMiasto" class="komunikat"></div>

Data urodzenia:
<input type="date" id="data" name="data"
onchange="usunBlad('data', 'bladData')">
<div id="bladData" class="komunikat"></div>

Telefon:
<input type="tel" id="telefon" name="telefon"
maxlength="9"
oninput="tylkoCyfry(); usunBlad('telefon', 'bladTelefon')">
<div id="bladTelefon" class="komunikat"></div>

Województwo:
<select id="wojewodztwo" name="wojewodztwo"
onchange="usunBlad('wojewodztwo', 'bladWojewodztwo')">
  <option value="">Wybierz województwo</option>
  <option value="mazowieckie">Mazowieckie</option>
  <option value="dolnoslaskie">Dolnośląskie</option>
  <option value="kujawskopomorskie">Kujawsko-pomorskie</option>
  <option value="lubuskie">Lubuskie</option>
  <option value="lubelskie">Lubelskie</option>
  <option value="lodzkie">Łódzkie</option>
  <option value="malopolskie">Małopolskie</option>
  <option value="opolskie">Opolskie</option>
  <option value="podkarpackie">Podkarpackie</option>
  <option value="podlaskie">Podlaskie</option>
  <option value="pomorskie">Pomorskie</option>
  <option value="slaskie">Śląskie</option>
  <option value="swietokrzyskie">Świętokrzyskie</option>
  <option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
  <option value="wielkopolskie">Wielkopolskie</option>
  <option value="zachodniopomorskie">Zachodniopomorskie</option>
</select>
<div id="bladWojewodztwo" class="komunikat"></div>

Hasło:
<input type="password" id="haslo" name="haslo"
oninput="usunBlad('haslo', 'bladHaslo')">
<div id="bladHaslo" class="komunikat"></div>

Email:
<input type="email" id="email" name="email"
oninput="usunBlad('email', 'bladEmail')">
<div id="bladEmail" class="komunikat"></div>

Prawo jazdy:
<input type="checkbox" name="prawojazdy"> <br>

Uwagi:
<textarea id="uwagi" name="uwagi" maxlength="250"
oninput="usunBlad('uwagi', 'bladUwagi')"></textarea>
<div id="bladUwagi" class="komunikat"></div>

<input type="submit" value="OK" name="p1">

</form>

<script>
function blad(pole, komunikat, tekst)
{
    document.getElementById(pole).style.borderColor = "red";
    document.getElementById(komunikat).textContent = tekst;
}

function usunBlad(pole, komunikat)
{
    document.getElementById(pole).style.borderColor = "lightgrey";
    document.getElementById(komunikat).textContent = "";
}

function tylkoCyfry()
{
    var telefon = document.getElementById("telefon");
    telefon.value = telefon.value.replace(/[^0-9]/, '');
}

function sprawdz()
{
var imie = document.getElementById("imie").value;
var nazwisko = document.getElementById("nazwisko").value;
var ulica = document.getElementById("ulica").value;
var miasto = document.getElementById("miasto").value;
var data = document.getElementById("data").value;
var telefon = document.getElementById("telefon").value;
var wojewodztwo = document.getElementById("wojewodztwo").value;
var haslo = document.getElementById("haslo").value;
var email = document.getElementById("email").value;
var uwagi = document.getElementById("uwagi").value;
var poprawny = true;
var regImie = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+$/;
var regNazwisko = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+([ -][A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+)?$/;
var regUlica = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ0-9 .\/-]*$/;
var regMiasto = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+([ -][A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]+){0,3}$/;
var regTelefon = /^[0-9]{9}$/;
var regHaslo = /^(?=.*[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ])(?=.*[0-9]).{8,}$/;
var regEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
if (!regImie.test(imie) || imie.length < 2 || imie.length > 50)
{
    blad("imie", "bladImie", "Imię musi mieć od 2 do 50 znaków i zaczynać się wielką literą.");
    poprawny = false;
}
else
{
    usunBlad("imie", "bladImie");
}
if (!regNazwisko.test(nazwisko) || nazwisko.length < 2 || nazwisko.length > 50)
{
    blad("nazwisko", "bladNazwisko", "Nazwisko musi mieć od 2 do 50 znaków i maksymalnie 2 człony.");
    poprawny = false;
}
else
{
    usunBlad("nazwisko", "bladNazwisko");
}

if (!regUlica.test(ulica) || ulica.length < 2 || ulica.length > 50)
{
    blad("ulica", "bladUlica", "Ulica musi mieć od 2 do 50 znaków i zaczynać się wielką literą.");
    poprawny = false;
}
else
{
    usunBlad("ulica", "bladUlica");
}

if (!regMiasto.test(miasto) || miasto.length < 2 || miasto.length > 50)
{
    blad("miasto", "bladMiasto", "Miasto musi mieć od 2 do 50 znaków i maksymalnie 4 człony.");
    poprawny = false;
}
else
{
    usunBlad("miasto", "bladMiasto");
}

if (data == "")
{
    blad("data", "bladData", "Podaj datę urodzenia");
    poprawny = false;
}
else
{
    usunBlad("data", "bladData");
}

if (!regTelefon.test(telefon))
{
    blad("telefon", "bladTelefon", "Telefon musi mieć dokładnie 9 cyfr");
    poprawny = false;
}
else
{
    usunBlad("telefon", "bladTelefon");
}

if (wojewodztwo == "")
{
    blad("wojewodztwo", "bladWojewodztwo", "Wybierz województwo");
    poprawny = false;
}
else
{
    usunBlad("wojewodztwo", "bladWojewodztwo");
}

if (!regHaslo.test(haslo))
{
    blad("haslo", "bladHaslo", "Hasło musi mieć minimum 8 znaków, w tym literę i cyfrę");
    poprawny = false;
}
else
{
    usunBlad("haslo", "bladHaslo");
}

if (!regEmail.test(email))
{
    blad("email", "bladEmail", "Podaj poprawny adres e-mail");
    poprawny = false;
}
else
{
    usunBlad("email", "bladEmail");
}

if (uwagi.length > 250)
{
    blad("uwagi", "bladUwagi", "Uwagi mogą mieć maksymalnie 250 znaków");
    poprawny = false;
}
else
{
    usunBlad("uwagi", "bladUwagi");
}

return poprawny;
}
</script>

</body>
</html>
